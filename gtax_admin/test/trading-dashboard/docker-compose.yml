version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: trading-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: trading_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 8080
      # Optional: Add your Alpha Vantage API key for real market data
      # ALPHA_VANTAGE_API_KEY: your-api-key-here
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trading-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  trading-network:
    driver: bridge
